plugins { id 'com.android.application' }

android {
    namespace 'dev.chet.batterygradient'
    compileSdk 35
    signingConfigs {
        debug {
            storeFile file('debug-signing.jks')
            storePassword 'batterygradient'
            keyAlias 'batterygradient'
            keyPassword 'batterygradient'
        }
    }
    defaultConfig {
        applicationId 'dev.chet.batterygradient'
        minSdk 31
        targetSdk 28
        versionCode 2
        versionName '1.0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
}

dependencies { compileOnly 'de.robv.android.xposed:api:82' }
